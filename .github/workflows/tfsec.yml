name: tfsec

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  security-events: write

jobs:
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec (console output)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false
          format: default

      - name: Generate SARIF report for GitHub Security
        if: always()
        run: tfsec --format=sarif --soft-fail --out tfsec.sarif .

      - name: Upload SARIF report
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
